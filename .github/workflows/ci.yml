name: CI — Lint, Test & Offline Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff mypy pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check .

      - name: Type check
        run: mypy --ignore-missing-imports --no-strict-optional app/ evals/
        continue-on-error: true  # non-blocking until types are fully annotated

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run unit tests
        run: pytest tests/ -v --tb=short

  offline-evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run offline evals
        run: python -m evals.eval_offline

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-eval-report
          path: evals/reports/offline_latest.json

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build app image (verify Dockerfile is valid)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: support-bot:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build rival-service image
        uses: docker/build-push-action@v6
        with:
          context: ./services/rival_service
          push: false
          tags: rival-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
